[build-system]
requires = ["setuptools >= 61", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "mieEODG"
version = "0.1.0"
description = "Mie scattering routines for spherical aerosol particles, ported from the EODG IDL package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# LUT persistence
lut = [
    "xarray",
    "netCDF4",
]
# Progress bars
progress = [
    "tqdm",
]
# Plotting and demo scripts
plot = [
    "matplotlib",
    "cmcrameri",
]
# Full install — everything except the Fortran extension (built separately)
full = [
    "xarray",
    "netCDF4",
    "tqdm",
    "matplotlib",
    "cmcrameri",
]
# Development
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mieEODG*"]

[tool.setuptools.package-data]
mieEODG = [
    "data/ARIA/**/*.ri",
    "fortran/*.pyi",
    # Compiled Fortran extension — included if present (built locally)
    "fortran/*.so",
    "fortran/*.pyd",
]
