[build-system]
# ninja is needed by f2py's meson backend; without it the Fortran kernel
# fails to build and the install silently falls back to the Python backend.
requires = ["setuptools>=77", "numpy", "wheel", "meson", "meson-python", "ninja"]
build-backend = "build"
backend-path = ["."]


[project]
name = "mieEODG"
version = "0.3.0"
description = "Python package for Mie scattering calculations on spherical aerosol particles, ported from the EODG IDL library"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jean-François Smekens", email = "js4247@nau.edu"}
]
keywords = ["Mie", "scattering", "aerosol", "optics", "radiative transfer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
# LUT persistence (NetCDF)
lut = [
    "xarray>=2022.3",
    "netCDF4>=1.5",
]
# Progress bars
progress = [
    "tqdm>=4.60",
]
# Plotting and demo scripts
plot = [
    "matplotlib>=3.5",
    "cmcrameri>=1.4",
]
# Full install — everything
full = [
    "xarray>=2022.3",
    "netCDF4>=1.5",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "cmcrameri>=1.4",
]
# Development and testing
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.urls]
Homepage = "https://github.com/jfsmekens/mieEODG"
"EODG Mie code" = "https://eodg.atm.ox.ac.uk/MIE/"
Repository = "https://github.com/jfsmekens/mieEODG.git"

[project.scripts]
mie-viewer = "mieEODG.mie_viewer:launch"

[tool.setuptools]
packages = ["mieEODG"]

[tool.setuptools.package-data]
mieEODG = [
    "data/ARIA/**/*.ri",
    "data/**/*.json",
    "data/**/*.csv",
    "data/**/*.md",
    "fortran/**/*.f90",
    "fortran/**/*.pyi",
    "fortran/**/*.so",
    "fortran/**/*.pyd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
